tabs:
  main:
    display: Main
    sections:
      -
        display: Content
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
          -
            handle: featured_image
            field:
              container: marketing_images
              type: assets
              display: 'Featured Image'
              max_files: 1
              min_files: 1
          -
            handle: content
            field:
              reading_time: true
              word_count: true
              container: marketing_images
              remove_empty_nodes: false
              type: bard
              display: Content
          -
            handle: author
            field:
              type: users
              display: Author
          -
            handle: description
            field:
              type: textarea
              display: Description
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
title: Article
