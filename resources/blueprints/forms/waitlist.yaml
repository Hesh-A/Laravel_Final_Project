tabs:
  main:
    display: Main
    sections:
      -
        fields:
          -
            handle: name
            field:
              placeholder: 'Your name goes here...'
              type: text
              display: Name
              validate:
                - required
          -
            handle: email
            field:
              input_type: email
              placeholder: 'Your email goes here...'
              type: text
              display: Email
              validate:
                - required
          -
            handle: notes
            field:
              placeholder: 'Your Note for Us goes here...'
              type: textarea
              display: Notes
