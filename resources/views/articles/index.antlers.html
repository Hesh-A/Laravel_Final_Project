<section class="mx-auto max-w-6xl px-4 py-12 sm:px-6 lg:py-16">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="space-y-3">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-primary">
                {{ type }}
            </p>
            <h1 class="text-4xl font-bold tracking-tight text-foreground sm:text-5xl">
                {{ heading }}
            </h1>
        </div>

        <div class="inline-flex items-center rounded-full border border-border bg-card px-3 py-1.5 text-sm text-muted-foreground">
            {{ collection:articles }}
                {{ if last }}{{ count }} posts{{ /if }}
            {{ /collection:articles }}
        </div>
    </div>

    <div class="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
        {{ collection:articles }}
            {{ partial:articles/_card }}
        {{ /collection:articles }}
    </div>
</section>
