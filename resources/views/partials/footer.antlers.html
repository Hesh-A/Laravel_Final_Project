<footer class="border-t border-border px-4 py-10 sm:px-6">
    <div class="mx-auto flex max-w-6xl flex-col gap-6 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <a href="/" class="font-semibold text-foreground">Idea</a>
            <p class="mt-2 text-sm text-muted-foreground">{{ footer:description }}</p>
        </div>

        <div class="flex flex-wrap items-center gap-x-6 gap-y-3 text-sm text-muted-foreground">
        <nav aria-label="Footer navigation">
            <ul class="flex flex-wrap items-center gap-x-6 gap-y-3 text-sm text-muted-foreground">
                {{ nav:footer }}
                    {{ if !logged_in || title == 'Contact' || title == 'Our Ideas' }}
                        <li>
                            <a
                                href="{{ url }}"
                                class="transition-colors hover:text-foreground"
                            >
                                {{ title }}
                            </a>
                        </li>
                    {{ /if }}
                {{ /nav:footer }}
            </ul>
        </nav>
        </div>
    </div>
</footer>
