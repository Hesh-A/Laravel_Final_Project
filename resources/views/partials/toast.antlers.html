<div
    x-data="{ toastVisible: true }"
    x-init="setTimeout(() => toastVisible = false, 4000)"
    x-show="toastVisible"
    x-transition.opacity.duration.500ms
    class="fixed bottom-4 right-4 z-[60] w-[calc(100%-2rem)] max-w-sm rounded-xl border border-primary/30 bg-card p-5 text-left shadow-2xl shadow-black/20"
    role="status"
    aria-live="polite"
>
    <div class="flex items-start justify-between gap-4">
        <div>
            <p class="font-semibold text-primary">{{ title }}</p>
            <p class="mt-2 text-sm text-muted-foreground">{{ message }}</p>
        </div>

        <button
            type="button"
            class="text-sm text-muted-foreground transition hover:text-foreground"
            aria-label="Dismiss notification"
            @click="toastVisible = false"
        >
            Close
        </button>
    </div>
</div>
