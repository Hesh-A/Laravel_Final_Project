<div class="rounded-xl border border-border bg-background/70 p-4 transition duration-300 hover:-translate-y-2 hover:border-primary/40 hover:shadow-xl hover:shadow-primary/10">
    <div class="flex items-start justify-between gap-4">
        <div>
            <h3 class="font-medium text-foreground">{{ title }}</h3>
            <p class="mt-2 text-sm text-muted-foreground">{{ description }}</p>
        </div>
        <span class="shrink-0 rounded-full bg-secondary/15 px-2 py-1 text-xs text-secondary">{{ status }}</span>
    </div>

    <div class="mt-4 flex justify-between text-xs text-muted-foreground">
        <span>{{ steps }} steps</span>
        <span>{{ updated }}</span>
    </div>
</div>
